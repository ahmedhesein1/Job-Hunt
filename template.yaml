StackName}-linkedin-orchestrator",{"stat":"Sum","label":"linkedin-orchestrator"}],["...","${AWS::StackName}-sync-gmail",{"stat":"Sum","label":"sync-gmail"}],["...","${AWS::StackName}-dispatch-notification",{"stat":"Sum","label":"dispatch-notification"}],["...","${AWS::StackName}-send-notification",{"stat":"Sum","label":"send-notification"}],["...","${AWS::StackName}-reconcile-outbox",{"stat":"Sum","label":"reconcile-outbox"}],["...","${AWS::StackName}-digest",{"stat":"Sum","label":"digest"}],["...","${AWS::StackName}-telegram-webhook",{"stat":"Sum","label":"telegram-webhook"}],["...","${AWS::StackName}-maintenance",{"stat":"Sum","label":"maintenance"}]]}},{"type":"metric","x":0,"y":8,"width":12,"height":6,"properties":{"title":"Lambda duration p95 (ms)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":3600,"metrics":[["AWS/Lambda","Duration","FunctionName","${AWS::StackName}-sync-company-boards",{"stat":"p95","label":"boards"}],["...","${AWS::StackName}-sync-source",{"stat":"p95","label":"sync-source"}],["...","${AWS::StackName}-sync-rendered-pages",{"stat":"p95","label":"rendered"}],["...","${AWS::StackName}-linkedin-orchestrator",{"stat":"p95","label":"linkedin"}]]}},{"type":"metric","x":12,"y":8,"width":12,"height":6,"properties":{"title":"DynamoDB capacity and throttles (per hour)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":3600,"metrics":[["AWS/DynamoDB","ConsumedReadCapacityUnits","TableName","${JobsTable}",{"stat":"Sum"}],[".","ConsumedWriteCapacityUnits",".",".",{"stat":"Sum"}],[".","ReadThrottleEvents",".",".",{"stat":"Sum"}],[".","WriteThrottleEvents",".",".",{"stat":"Sum"}]]}},{"type":"metric","x":0,"y":14,"width":12,"height":6,"properties":{"title":"SQS notification queue (per hour)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":3600,"metrics":[["AWS/SQS","NumberOfMessagesSent","QueueName","${NotificationQueue.QueueName}",{"stat":"Sum"}],[".","NumberOfEmptyReceives",".",".",{"stat